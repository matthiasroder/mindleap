name: Research Assistant

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-assistant
  cancel-in-progress: false

jobs:
  research:
    # Scheduling is opt-in for each personal vault. Manual runs remain available.
    if: github.event_name == 'workflow_dispatch' || vars.RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/research_assistant/requirements.txt

      - name: Check research credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.research_assistant.llm import load_models, required_api_keys

          required = required_api_keys(load_models(Path("config/research.yaml")))
          missing = sorted(name for name in required if not os.environ.get(name))
          if missing:
              for name in missing:
                  print(f"::error::Set the {name} repository secret before running research.")
              raise SystemExit(1)
          PY

      - name: Run research assistant
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python -m scripts.research_assistant.main

      - name: Commit and push digest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Research Assistant"
          git add feeds/
          if git diff --staged --quiet; then
            echo "No research output changes to publish"
            exit 0
          fi
          git commit -m "Add research digest for $(date +%Y-%m-%d)"
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
